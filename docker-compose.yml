# Ambiente local do lesson-recommender.
#
# Perfis:
#   core          -> Neo4j, Redis (cache), MinIO (artefatos do modelo), carga do dataset e API
#   observability -> Jaeger (traces OTLP) e Prometheus (métricas da API)
#
# Senhas e chaves abaixo são apenas de desenvolvimento (dev-only-*). Variáveis em .env.example.

name: lesson-recommender

x-app-env: &app-env
  LR_NEO4J_URI: bolt://neo4j:7687
  LR_NEO4J_USER: neo4j
  LR_NEO4J_PASSWORD: ${LR_NEO4J_PASSWORD:-dev-only-change-me}
  LR_ARTIFACTS_BACKEND: s3
  LR_S3_ENDPOINT_URL: http://minio:9000
  LR_S3_BUCKET: ${LR_S3_BUCKET:-lesson-recommender-artifacts}
  LR_S3_ACCESS_KEY: ${LR_S3_ACCESS_KEY:-dev-only-minio}
  LR_S3_SECRET_KEY: ${LR_S3_SECRET_KEY:-dev-only-change-me}
  LR_EMBEDDINGS_BACKEND: hashing
  LR_LOG_LEVEL: ${LR_LOG_LEVEL:-INFO}

services:
  neo4j:
    image: neo4j:5.26-community
    profiles: [core]
    environment:
      NEO4J_AUTH: neo4j/${LR_NEO4J_PASSWORD:-dev-only-change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${LR_NEO4J_HTTP_PORT:-7474}:7474"
      - "${LR_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    networks: [lesson-recommender]
    healthcheck:
      # wget em vez de cypher-shell: o cypher-shell sobe outra JVM e estoura o limite de memória.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474/"]
      interval: 10s
      timeout: 20s
      start_period: 60s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    image: redis:7.4.6-alpine
    profiles: [core]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LR_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks: [lesson-recommender]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m

  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LR_S3_ACCESS_KEY:-dev-only-minio}
      MINIO_ROOT_PASSWORD: ${LR_S3_SECRET_KEY:-dev-only-change-me}
    ports:
      - "${LR_MINIO_API_PORT:-9000}:9000"
      - "${LR_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [lesson-recommender]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    profiles: [core]
    environment:
      LR_S3_BUCKET: ${LR_S3_BUCKET:-lesson-recommender-artifacts}
      LR_S3_ACCESS_KEY: ${LR_S3_ACCESS_KEY:-dev-only-minio}
      LR_S3_SECRET_KEY: ${LR_S3_SECRET_KEY:-dev-only-change-me}
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    volumes:
      - ./deploy/minio:/init:ro
    networks: [lesson-recommender]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    image: lesson-recommender:dev
    profiles: [core]
    command:
      - sh
      - -c
      - >-
        lesson-recommender generate --output /tmp/dataset.json &&
        lesson-recommender load-graph --dataset /tmp/dataset.json &&
        lesson-recommender evaluate --dataset /tmp/dataset.json
        --output /tmp/avaliacao.md --publish
    environment: *app-env
    networks: [lesson-recommender]
    depends_on:
      neo4j:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: lesson-recommender:dev
    profiles: [core]
    environment:
      <<: *app-env
      LR_REPOSITORY_BACKEND: neo4j
      LR_REDIS_URL: redis://redis:6379/0
      LR_RECOMMENDATIONS_CACHE_TTL_SECONDS: ${LR_RECOMMENDATIONS_CACHE_TTL_SECONDS:-120}
      LR_OTEL_EXPORTER_OTLP_ENDPOINT: ${LR_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${LR_API_PORT:-8000}:8000"
    networks: [lesson-recommender]
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [observability]
    ports:
      - "${LR_JAEGER_UI_PORT:-16686}:16686"
      - "${LR_OTLP_HTTP_PORT:-4318}:4318"
    networks: [lesson-recommender]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${LR_PROMETHEUS_PORT:-9090}:9090"
    networks: [lesson-recommender]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  neo4j-data:
  redis-data:
  minio-data:
  prometheus-data:

networks:
  lesson-recommender:
    name: lesson-recommender-net
