name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: Testes (unidade + integração Neo4j)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: pytest (testcontainers sobe o Neo4j no Docker do runner)
        run: pytest --cov=lesson_recommender --cov-report=term-missing
      - name: Relatório de avaliação é reprodutível
        run: |
          lesson-recommender generate --output data/dataset.json
          lesson-recommender evaluate --dataset data/dataset.json --output reports/avaliacao.md
          git diff --exit-code reports/avaliacao.md

  build:
    name: Build (wheel e imagem)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: docker build -t lesson-recommender:ci .
